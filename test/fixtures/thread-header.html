<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>thread header under the real app nav</title>
<!--
  Faithful reproduction of the REAL ancestor chain for the LOKY AI conversation
  header. The previous fixture rendered the header markup alone, which is why it
  passed while the live app showed nothing: it had no fixed .appnav above it and
  no .connect (position:fixed; inset:0) around it.

  This page loads the real public/styles.css + public/upgrade.css and builds:
    .appnav            (position:fixed, z-index:60, height:var(--nav-h))
    .app > section.connect#connect   (position:fixed, inset:0, z-index:40)
             > section.connect-thread (position:absolute, inset:0)
                     > header.connect-thread__top

  It then asserts the header clears the nav and that the controls are the
  topmost element at their own centre points — the check that computed styles
  alone cannot make. Prints FIXTURE-RESULT: PASS|FAIL in #report.
-->
<link rel="stylesheet" href="/public/styles.css" />
<link rel="stylesheet" href="/public/upgrade.css" />
<style>
  body { margin: 0; }
  #report { position: fixed; right: 8px; bottom: 8px; z-index: 9999;
            max-width: 46ch; max-height: 60vh; overflow: auto; margin: 0;
            padding: 8px 10px; border-radius: 8px;
            background: rgba(0,0,0,0.85); color: #d6fff0;
            font: 11px/1.45 ui-monospace, monospace; white-space: pre-wrap; }
</style>
</head>
<body>

<!-- The real app nav: fixed, z-index 60, height var(--nav-h). -->
<nav class="appnav" id="nav">
  <div class="appnav__brand">
    <span class="appnav__mark appnav__mark--sm"></span>
    <span class="appnav__name">LOKY AI</span>
  </div>
  <div class="appnav__switch">
    <button class="appnav__tab" type="button" aria-selected="false">AI Assistant</button>
    <button class="appnav__tab" type="button" aria-selected="true">Messages</button>
  </div>
</nav>

<div class="app">
  <section class="connect" id="connect">
    <section class="connect-thread">
      <header class="connect-thread__top">
        <button class="connect-icon connect-icon--back" id="back" type="button" aria-label="Back to chats">
          <span class="connect-back__arrow" id="arrow">
            <svg class="connect-icon__svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6"></path>
            </svg>
          </span>
          <span class="connect-back__label" id="label">Back to chats</span>
        </button>

        <div class="connect-thread__who">
          <strong class="connect-thread__name">@sunita</strong>
        </div>

        <div class="connect-friend__more connect-thread__more">
          <button class="connect-friend__dots" id="dots" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="Manage @sunita">
            <svg class="connect-icon__svg" viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="currentColor">
              <circle cx="12" cy="5.5" r="1.85"></circle>
              <circle cx="12" cy="12" r="1.85"></circle>
              <circle cx="12" cy="18.5" r="1.85"></circle>
            </svg>
          </button>
        </div>
      </header>

      <div class="connect-thread__scroll" id="scroll">sample message</div>
    </section>
  </section>
</div>

<pre id="report">measuring…</pre>

<script>
(function () {
  const out = [];
  let failed = 0;
  const pass = (ok, label, detail) => {
    if (!ok) failed += 1;
    out.push((ok ? '[PASS] ' : '[FAIL] ') + label + (detail ? ' — ' + detail : ''));
  };
  const rect = (el) => {
    const r = el.getBoundingClientRect();
    return { top: Math.round(r.top), bottom: Math.round(r.bottom), left: Math.round(r.left), right: Math.round(r.right), w: Math.round(r.width), h: Math.round(r.height) };
  };
  const desc = (el) => el ? el.tagName.toLowerCase() + (el.id ? '#' + el.id : '') + (typeof el.className === 'string' && el.className ? '.' + el.className.trim().split(/\s+/).join('.') : '') : 'null';
  // What actually paints at the control's own centre?
  const topAt = (el) => {
    const r = el.getBoundingClientRect();
    const stack = document.elementsFromPoint(Math.round(r.left + r.width / 2), Math.round(r.top + r.height / 2));
    return stack;
  };
  const ownedBy = (el, stack) => !!(stack[0] && (stack[0] === el || el.contains(stack[0])));

  const nav = document.getElementById('nav');
  const header = document.querySelector('.connect-thread__top');
  const back = document.getElementById('back');
  const dots = document.getElementById('dots');
  const label = document.getElementById('label');

  const navRect = rect(nav);
  const headRect = rect(header);

  // 1. The header must start at or below the nav's bottom edge.
  pass(headRect.top >= navRect.bottom - 1, 'header clears the fixed nav',
    'header.top=' + headRect.top + ' nav.bottom=' + navRect.bottom);

  // 2. Both controls must be inside the viewport.
  [['back', back], ['dots', dots]].forEach(([name, el]) => {
    const r = rect(el);
    pass(r.top >= 0 && r.bottom <= window.innerHeight && r.w > 0 && r.h > 0,
      name + ' is inside the viewport', name + '=' + r.w + 'x' + r.h + ' at ' + r.left + ',' + r.top);
  });

  // 3. Nothing may paint over them: the topmost element at each centre point
  //    must be the control itself (or its child svg/label).
  [['back', back], ['dots', dots]].forEach(([name, el]) => {
    const stack = topAt(el);
    pass(ownedBy(el, stack), name + ' is topmost at its centre',
      'top=' + desc(stack[0]) + ' stack=' + stack.slice(0, 3).map(desc).join(' > '));
  });

  // 4. The three dots must be three real, sized circles.
  const circles = dots.querySelectorAll('svg circle');
  const c0 = circles[0] ? circles[0].getBoundingClientRect() : null;
  pass(circles.length === 3 && c0 && c0.width > 0 && c0.height > 0,
    'dots button holds three visible circles',
    circles.length + ' circles, first=' + (c0 ? Math.round(c0.width) + 'x' + Math.round(c0.height) : 'none'));

  // 5. The arrow must paint a stroke, not vanish.
  const arrow = document.querySelector('#arrow svg path');
  const aStyle = arrow ? getComputedStyle(arrow) : null;
  pass(!!arrow && aStyle.stroke !== 'none' && aStyle.stroke !== 'rgba(0, 0, 0, 0)',
    'back arrow draws a visible stroke', aStyle ? 'stroke=' + aStyle.stroke : 'no path');

  // 6. Desktop label must be permanently visible.
  const lStyle = getComputedStyle(label);
  const lRect = rect(label);
  pass(window.innerWidth < 720 || (lStyle.display !== 'none' && lRect.w > 0),
    'desktop label is visible', 'display=' + lStyle.display + ' width=' + lRect.w);

  document.getElementById('report').textContent =
    out.join('\n') + '\n\nFIXTURE-RESULT: ' + (failed ? 'FAIL (' + failed + ')' : 'PASS');
})();
</script>
</body>
</html>
